<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>FRST Sports Design Catalogue</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}
header{border-bottom:1px solid #242424}.nav{max-width:780px;margin:auto;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.brand{font-weight:900;font-size:19px;letter-spacing:.2px}.brand b{color:#8B5CF6}.brand small{display:block;font-size:8px;font-weight:500;color:#aaa;margin-top:1px}.nav span{font-size:9px;color:#aaa}
main{max-width:780px;margin:auto;padding:30px 10px 55px}.hero h1{font-size:34px;letter-spacing:-1.2px;margin:0 0 6px}.hero p{font-size:11px;color:#aaa;margin:0 0 25px}
.controls{display:flex;gap:7px;margin-bottom:15px}.search{flex:1;background:#151517;border:1px solid #2a2a2e;color:#fff;border-radius:7px;padding:10px 12px;outline:none;font-size:11px}.search:focus{border-color:#777}
.filters{display:flex;gap:6px}.filter{border:1px solid #2b2b30;background:#111114;color:#fff;border-radius:999px;padding:9px 13px;font-size:10px;cursor:pointer}.filter.active{background:#8B5CF6;border-color:#8B5CF6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{background:#111114;border:1px solid #252529;border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{border-color:#555;transform:translateY(-1px)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#171717}.info{padding:9px 9px 10px;display:flex;justify-content:space-between;align-items:center}.code{font-weight:900;font-size:11px}.sport{font-size:8px;color:#aaa}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{width:min(880px,100%);background:#101010;border:1px solid #333;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1fr 250px}
.big{width:100%;height:min(78vh,720px);object-fit:contain;background:#050505}.side{padding:22px;display:flex;flex-direction:column}.close{align-self:flex-end;background:#222;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px}.side h2{font-size:27px;margin:auto 0 4px}.side p{color:#aaa;font-size:11px;margin:0 0 17px}.wa{background:#fff;color:#000;text-decoration:none;text-align:center;border-radius:7px;padding:13px;font-weight:900;font-size:11px}
.empty{text-align:center;color:#777;padding:60px 0;font-size:12px}
@media(max-width:650px){.nav{padding:0 12px}main{padding:24px 12px 45px}.hero h1{font-size:29px}.controls{display:block}.filters{margin-top:8px;overflow:auto}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.box{display:block}.big{height:auto;max-height:68vh}.side{padding:15px}.side h2{margin:14px 0 3px}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">FRST <b>SPORTS</b><small>Be the first</small></div><span>Design Catalogue</span></div></header>
<main><section class="hero"><h1>Choose Your Team Design</h1><p>Select a design and send its code directly on WhatsApp.</p></section>
<div class="controls"><input id="search" class="search" placeholder="Search design code e.g. CR-001"><div id="filters" class="filters"></div></div>
<section id="grid" class="grid"></section><div id="empty" class="empty" hidden>No design found.</div></main>
<div id="modal" class="modal"><div class="box"><img id="big" class="big"><div class="side"><button id="close" class="close">×</button><h2 id="mcode"></h2><p id="msport"></p><a id="wa" class="wa" target="_blank">SELECT ON WHATSAPP</a></div></div></div>
<script src="designs.js"></script>
<script>
const PHONE="919680308441", designs=window.FRST_DESIGNS||[];let active="All";
const grid=document.getElementById("grid"),filters=document.getElementById("filters"),search=document.getElementById("search"),empty=document.getElementById("empty"),modal=document.getElementById("modal");
function drawFilters(){let s=["All",...new Set(designs.map(d=>d.sport))];filters.innerHTML=s.map(x=>`<button class="filter ${x===active?"active":""}">${x}</button>`).join("");[...filters.children].forEach(b=>b.onclick=()=>{active=b.textContent;drawFilters();draw()})}
function openD(d){big.src=d.image;mcode.textContent=d.code;msport.textContent=d.sport+" Design";wa.href=`https://wa.me/${PHONE}?text=${encodeURIComponent("Hi FRST Sports, I want design "+d.code+".")}`;modal.classList.add("open");document.body.style.overflow="hidden"}
function draw(){let q=search.value.trim().toLowerCase(), list=designs.filter(d=>(active==="All"||d.sport===active)&&(!q||d.code.toLowerCase().includes(q)));grid.innerHTML=list.map(d=>`<article class="card" data-code="${d.code}"><img src="${d.image}" loading="lazy" decoding="async"><div class="info"><span class="code">${d.code}</span><span class="sport">${d.sport}</span></div></article>`).join("");empty.hidden=!!list.length;grid.querySelectorAll(".card").forEach(c=>c.onclick=()=>openD(designs.find(d=>d.code===c.dataset.code)))}
search.oninput=draw;close.onclick=()=>{modal.classList.remove("open");document.body.style.overflow=""};modal.onclick=e=>{if(e.target===modal)close.click()};document.onkeydown=e=>{if(e.key==="Escape")close.click()};drawFilters();draw();
</script></body></html>
