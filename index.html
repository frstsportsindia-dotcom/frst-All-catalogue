<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>FRST Sports — Design Catalogue</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#111;font-family:Inter,Arial,Helvetica,sans-serif}button,input{font:inherit}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #eee}
.nav{max-width:1440px;margin:auto;height:72px;padding:0 30px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:950;font-size:22px;letter-spacing:-1px}.logo small{display:block;font-size:9px;letter-spacing:2px;font-weight:700;margin-top:1px}
.navright{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
main{max-width:1440px;margin:auto;padding:0 30px 60px}
.hero{padding:54px 0 34px;border-bottom:1px solid #e9e9e9}.hero h1{font-size:clamp(36px,5vw,72px);line-height:.94;letter-spacing:-.055em;margin:0;max-width:850px}.hero p{font-size:15px;color:#666;margin:18px 0 0}
.toolbar{padding:22px 0;display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:72px;background:#fff;z-index:20}
.categories{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}
.cat{border:0;background:#f3f3f3;color:#111;border-radius:999px;padding:11px 18px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:13px}.cat.active{background:#111;color:#fff}
.search{width:min(360px,42vw);border:1px solid #ddd;background:#fff;border-radius:999px;padding:11px 18px;outline:none}.search:focus{border-color:#111}
.count{font-size:12px;color:#777;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{position:relative;background:#f5f5f5;overflow:hidden;cursor:pointer}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;transition:transform .35s ease}.card:hover .photo{transform:scale(1.018)}
.meta{background:#fff;padding:12px 2px 22px;display:flex;justify-content:space-between;align-items:center}.code{font-size:14px;font-weight:850}.sport{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.empty{padding:70px 0;text-align:center;color:#777}.footer{border-top:1px solid #eee;margin-top:50px;padding:28px 0;color:#777;font-size:12px;display:flex;justify-content:space-between}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}.modal.open{display:flex}.panel{width:min(1050px,100%);max-height:94vh;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) 290px;overflow:auto}.preview{background:#eee;min-height:500px;display:flex;align-items:center;justify-content:center}.preview img{width:100%;height:100%;max-height:90vh;object-fit:contain}.side{padding:28px;display:flex;flex-direction:column}.close{align-self:flex-end;border:0;background:#f1f1f1;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}.side h2{font-size:30px;letter-spacing:-.04em;margin:auto 0 6px}.side p{color:#777;margin:0 0 22px}.wa{display:block;background:#111;color:#fff;text-decoration:none;text-align:center;padding:15px;font-weight:800;font-size:14px}.hint{font-size:11px;color:#999;margin-top:12px;line-height:1.5}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.nav{height:62px;padding:0 16px}main{padding:0 12px 40px}.hero{padding:34px 4px 26px}.toolbar{top:62px;padding:14px 0;display:block}.categories{margin-bottom:10px}.search{width:100%}.grid{grid-template-columns:repeat(2,1fr);gap:7px}.meta{padding:9px 2px 18px}.panel{display:block}.preview{min-height:0}.side{padding:18px}.side h2{margin:20px 0 4px}.footer{padding:22px 4px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">FRST SPORTS<small>BE THE FIRST</small></div><div class="navright">Design Catalogue</div></div></header>
<main>
<section class="hero"><h1>Find your team’s next look.</h1><p>Choose a design, open it, and send the design code directly to FRST Sports.</p></section>
<section class="toolbar"><div id="cats" class="categories"></div><input id="search" class="search" placeholder="Search design code"></section>
<div id="count" class="count"></div><section id="grid" class="grid"></section><div id="empty" class="empty" hidden>No design found.</div>
<footer class="footer"><span>© FRST Sports</span><span>Custom Teamwear</span></footer>
</main>
<div id="modal" class="modal" aria-hidden="true"><div class="panel"><div class="preview"><img id="modalImg" alt=""></div><div class="side"><button id="close" class="close">×</button><h2 id="modalCode"></h2><p id="modalSport"></p><a id="modalWa" class="wa" target="_blank" rel="noopener">SELECT THIS DESIGN</a><div class="hint">Your selected design code will be added automatically to WhatsApp.</div></div></div></div>
<script>
const WHATSAPP_NUMBER="919680308441";

/*
EASY ADD SYSTEM
1. Upload the new image into GitHub > images folder.
2. Rename it like: CR-011.webp / FB-001.webp / VB-001.webp / BB-001.webp
3. Add only ONE line below, for example:
   {code:"CR-011",sport:"Cricket",image:"images/CR-011.webp"},
*/
const designs=[
{code:"CR-001",sport:"Cricket",image:"images/cr-001.webp"},
{code:"CR-002",sport:"Cricket",image:"images/cr-002.webp"},
{code:"CR-003",sport:"Cricket",image:"images/cr-003.webp"},
{code:"CR-004",sport:"Cricket",image:"images/cr-004.webp"},
{code:"CR-005",sport:"Cricket",image:"images/cr-005.webp"},
{code:"CR-006",sport:"Cricket",image:"images/cr-006.webp"},
{code:"CR-007",sport:"Cricket",image:"images/cr-007.webp"},
{code:"CR-008",sport:"Cricket",image:"images/cr-008.webp"},
{code:"CR-009",sport:"Cricket",image:"images/cr-009.webp"},
{code:"CR-010",sport:"Cricket",image:"images/cr-010.webp"}
];

let active="All";
const grid=document.querySelector("#grid"),cats=document.querySelector("#cats"),search=document.querySelector("#search"),empty=document.querySelector("#empty"),count=document.querySelector("#count");
const modal=document.querySelector("#modal"),modalImg=document.querySelector("#modalImg"),modalCode=document.querySelector("#modalCode"),modalSport=document.querySelector("#modalSport"),modalWa=document.querySelector("#modalWa");
function sports(){return ["All",...new Set(designs.map(x=>x.sport))]}
function renderCats(){cats.innerHTML=sports().map(x=>`<button class="cat ${x===active?"active":""}" data-s="${x}">${x}</button>`).join("");cats.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.s;renderCats();render()})}
function openDesign(d){modalImg.src=d.image;modalImg.alt=d.code;modalCode.textContent=d.code;modalSport.textContent=d.sport+" Design";modalWa.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Hi FRST Sports, I want design "+d.code+".")}`;modal.classList.add("open");document.body.style.overflow="hidden"}
function closeModal(){modal.classList.remove("open");document.body.style.overflow=""}
function render(){let q=search.value.trim().toLowerCase();let list=designs.filter(d=>(active==="All"||d.sport===active)&&(!q||d.code.toLowerCase().includes(q)||d.sport.toLowerCase().includes(q)));count.textContent=list.length+" designs";grid.innerHTML=list.map((d,i)=>`<article class="card" data-i="${designs.indexOf(d)}"><img class="photo" loading="${i<8?"eager":"lazy"}" decoding="async" src="${d.image}" alt="${d.code} ${d.sport} jersey"><div class="meta"><span class="code">${d.code}</span><span class="sport">${d.sport}</span></div></article>`).join("");empty.hidden=!!list.length;grid.querySelectorAll(".card").forEach(c=>c.onclick=()=>openDesign(designs[+c.dataset.i]))}
search.oninput=render;document.querySelector("#close").onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.onkeydown=e=>{if(e.key==="Escape")closeModal()};renderCats();render();
</script>
</body></html>
