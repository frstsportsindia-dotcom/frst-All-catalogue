name: Update FRST Catalogue

on:
  push:
    paths:
      - "incoming/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update catalogue
        run: python update_catalog.py

      - name: Save updated catalogue
        run: |
          git config user.name "FRST Catalogue Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto update FRST catalogue"
          git push
